services:
  soketi:
    image: "quay.io/soketi/soketi:latest-16-alpine"
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      SOKETI_DEBUG: "1"
      SOKETI_DEFAULT_APP_ID: "nextmatch-app-id"
      SOKETI_DEFAULT_APP_KEY: "nextmatch-app-key"
      SOKETI_DEFAULT_APP_SECRET: "nextmatch-app-secret"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: true
      SOKETI_USER_AUTHENTICATION_TIMEOUT: "30000"
